name: AB-Serial Analyzer · pruebas y capturas reales
on:
  push:
    branches: [AB-Serial-Analyzer-v0.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AB-Serial-Analyzer-v0.1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar el motor Python y los protocolos
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: node --check ab_serial/web/app.js
      - name: Instalar navegador de pruebas
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Generar capturas contra el laboratorio real
        run: python tools/capture_screenshots.py
      - name: Conservar artefactos de capturas
        uses: actions/upload-artifact@v4
        with:
          name: AB-Serial-Analyzer-capturas-reales
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Publicar capturas PNG verificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(serial): publish real desktop, decoder and mobile screenshots'
            git push origin HEAD:AB-Serial-Analyzer-v0.1
          fi
